[package]
name = "lokki-api"
version = "0.3.0"
description = "LokkiAPI - local-first, lightweight API client"
authors = ["Lisovsky-UwU"]
license = "Apache-2.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "lokki_api_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
chrono = "0.4"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
ulid = { version = "1", features = ["serde"] }
thiserror = "2"
regex = "1"
# OpenAPI specs are written in YAML far more often than in JSON; serde_json
# handles the JSON half.
serde_yaml_ng = "0.10"
async-trait = "0.1"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Only the pieces cancellation, the stream's head timeout and the WebSocket
# connection need; tauri already builds the runtime.
tokio = { version = "1", features = ["sync", "macros", "time", "net"] }
# WebSocket. Only the handshake and the framing: the connection is opened by
# exec::ws itself, so DNS, TCP and TLS each get a phase in the trace and the
# TLS setting is honoured the same way it is for HTTP.
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
# ring rather than the default aws-lc-rs, which needs cmake and nasm to build;
# reqwest already pulls rustls in with ring.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
# The same Mozilla root set reqwest's rustls-tls trusts.
webpki-roots = "1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
