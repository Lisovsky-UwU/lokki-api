name: CI

on:
  push:
    branches:
      - master
  pull_request:

# A new push to the same branch makes the previous run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: svelte-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run check

  rust:
    # Both, because store/ does path work and the two platforms disagree
    # about separators, case sensitivity and what is a legal filename.
    name: cargo test (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        platform:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      # The tauri crate links against webkit2gtk even when only tests are built.
      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            curl wget file patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      # --all-targets also compiles examples/, so smoke.rs and fixture.rs
      # cannot rot unnoticed; cargo builds them without running them, so
      # the network call in smoke.rs stays out of CI.
      - name: cargo test
        working-directory: src-tauri
        run: cargo test --all-targets
